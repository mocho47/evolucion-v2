services:
  - type: web
    name: evolucion-v2
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn evolucion_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ZAI_API_KEY
        sync: false
      - key: EVO_DB
        value: /data/evolucion.db
    disk:
      name: evolucion-db
      mountPath: /data
      sizeGB: 1
